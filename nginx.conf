server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =====================================================
    # Penalty API  (must be before SPA catch-all)
    # Browser:  /penalty-api/penalty/occurrences|summary|vendors
    # Backend:  http://45.195.229.15:18088/api/penalty/...
    # =====================================================
    location ^~ /penalty-api/ {
        proxy_pass http://45.195.229.15:18088/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =====================================================
    # Dashboard / Plants / STP live API
    # Browser:  /dashboard-api/...
    # Backend:  http://45.195.229.15:18087/api/...
    # =====================================================
    location ^~ /dashboard-api/ {
        proxy_pass http://45.195.229.15:18087/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =====================================================
    # CCTV API
    # =====================================================
    location ^~ /cctv-api/ {
        proxy_pass http://host.docker.internal:8080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =====================================================
    # STP API
    # =====================================================
    location ^~ /stp-api/ {
        proxy_pass http://host.docker.internal:8080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =====================================================
    # React / Vite SPA (last — never intercept API prefixes)
    # =====================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}

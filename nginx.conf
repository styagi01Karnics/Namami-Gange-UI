
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Penalty API
    location ^~ /penalty-api/ {
        proxy_pass http://45.195.229.15:18088/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Dashboard / Plants / STP live + MQTT SSE
    location ^~ /dashboard-api/ {
        proxy_pass http://45.195.229.15:18087/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # CCTV API
    location ^~ /cctv-api/ {
        proxy_pass http://45.195.229.15:18091/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_hide_header Accept-Ranges;
        add_header Accept-Ranges bytes always;

        proxy_connect_timeout 60s;
    }

    # STP API
    location ^~ /stp-api/ {
        proxy_pass http://host.docker.internal:8080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Local CCTV mp4 clips (mounted from /opt/stp-cctv)
    location ^~ /stp-cctv/ {
        alias /opt/stp-cctv/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-cache";
    }

    # React / Vite SPA fallback
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # =====================================================
    # React / Vite SPA
    # =====================================================
    location / {
        try_files $uri $uri/ /index.html;
    }


    # =====================================================
    # Ayurvedaa Attendance API
    #
    # Browser:
    #   /api/v1/employee-attendances/daily
    #
    # Backend:
    #   application-server:8106
    # =====================================================
    location /api/ {
        proxy_pass http://host.docker.internal:8106;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # =====================================================
    # STP API
    #
    # Browser:
    #   /stp-api/v1/stp/...
    #
    # Backend:
    #   http://application-server:8080/api/...
    # =====================================================
    location /stp-api/ {
        proxy_pass http://host.docker.internal:8080/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # =====================================================
    # CCTV API
    #
    # Browser:
    #   /cctv-api/sites
    #   /cctv-api/cameras
    #
    # Backend:
    #   http://application-server:8080/api/...
    # =====================================================
    location /cctv-api/ {
        proxy_pass http://host.docker.internal:8080/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
